services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: golda-api
    runtime: node
    region: oregon
    plan: free
    rootDir: Server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false   # fill after golda-client is deployed

  # ── Frontend Static Site ──────────────────────────────────────────────────────
  - type: web
    name: golda-client
    runtime: static
    rootDir: Client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # fill after golda-api is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
